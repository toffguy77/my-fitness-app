# Куда уходит сработавшее правило.
#
# Телеграм выбран как канал, до которого доходит: письмо легко пропустить, а
# оповещение о росте ошибок нужно увидеть тогда, когда оно пришло.
#
# Alertmanager не раскрывает переменные окружения в своём конфиге: ${VAR}
# осталось бы здесь буквальным текстом, оповещения уходили бы с неверным
# токеном и молча не доходили. Поэтому в файле стоят метки, а значения
# подставляются при старте контейнера — см. команду в docker-compose.monitoring.yml.

global:
  resolve_timeout: 5m

route:
  receiver: telegram
  # Сгруппировать по среде и правилу: десять маршрутов, упавших от одной
  # причины, — это одно сообщение, а не десять.
  group_by: ['alertname', 'environment']
  group_wait: 30s
  group_interval: 5m
  # Повтор раз в четыре часа: достаточно часто, чтобы о незакрытой проблеме не
  # забыли, достаточно редко, чтобы канал не стали игнорировать.
  repeat_interval: 4h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token: ${TELEGRAM_ALERT_BOT_TOKEN}
        chat_id: __CHAT_ID__
        parse_mode: ''
        message: |-
          {{ if eq .Status "firing" }}🔴{{ else }}✅{{ end }} {{ .CommonLabels.alertname }}
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ if .Annotations.description }}{{ .Annotations.description }}{{ end }}{{ end }}
