# Источник данных прописан здесь, а не руками в интерфейсе: дашборд, который
# нельзя восстановить из репозитория, — это дашборд, который однажды исчезнет.
apiVersion: 1

datasources:
  - name: Prometheus
    # uid задан явно: на него ссылается каждая панель дашборда. Если оставить
    # его на усмотрение Grafana, ссылки не совпадут и панели будут пустыми —
    # без единой ошибки, просто без данных.
    uid: burcev-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
