# Оповещения по симптомам, а не по причинам.
#
# Правило стоит здесь только тогда, когда на него есть что ответить: сигнал,
# на который дежурный ничего не делает, через месяц перестают читать.
#
# Имена метрик — с префиксом burcev_: пространство имён задаётся при создании
# (telemetry.New("burcev", ...)). Правило, написанное по памяти без префикса,
# не сработает никогда и об этом никак не сообщит.

groups:
  - name: burcev
    rules:
      # Сценарий спеки «Рост доли ошибок сервера».
      - alert: HighServerErrorRate
        expr: |
          sum by (environment) (rate(burcev_http_requests_total{status=~"5.."}[5m]))
            /
          sum by (environment) (rate(burcev_http_requests_total[5m]))
            > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.environment }}: больше 5% ответов — ошибки сервера"
          description: >-
            Разбивка по маршрутам:
            topk(5, sum by (route) (rate(burcev_http_requests_total{status=~"5.."}[5m])))

      # Опрос не проходит: контейнер упал, завис или потерял сеть.
      - alert: ServiceDown
        expr: up{job="burcev-api"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.environment }}: сервис не отвечает на опрос метрик"

      # Запросы реально ждали соединения с базой. Это симптом, а не догадка о
      # заполненности пула: счётчик растёт только тогда, когда кто-то стоял в
      # очереди. Верхней границы пула среди метрик нет, и сравнивать не с чем.
      - alert: DatabaseConnectionWaits
        expr: increase(burcev_db_connection_waits_total[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.environment }}: запросы ждут свободного соединения с БД"

      # Фоновая задача упала. В вебе этого не видно — только здесь.
      #
      # exported_job, а не job: у метрики своя метка job, а Prometheus держит
      # под этим именем имя цели опроса и переименовывает чужую с префиксом.
      - alert: BackgroundJobFailing
        expr: increase(burcev_job_runs_total{status="failure"}[1h]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: >-
            {{ $labels.environment }}: фоновая задача
            {{ $labels.exported_job }} завершилась ошибкой

      # Провайдер перестал отдавать префикс из кэша.
      #
      # Бот поддержки отправляет перед каждым вопросом всё руководство
      # пользователя. Пока префикс байт в байт неизменен, провайдер читает его
      # из кэша и это почти ничего не стоит. Стоит добавить перед точкой
      # кэширования метку времени, идентификатор запроса или меняющееся
      # приветствие — и каждый вопрос станет промахом.
      #
      # Ничего при этом не ломается: ответы те же, ошибок нет, в логах тихо.
      # Растёт только счёт, и заметить это можно единственным способом —
      # измерив. Порог в половину выбран с запасом: при исправном кэше доля
      # держится заметно выше, а разовые промахи после выкатки её не роняют.
      #
      # Условие после and отсекает часы без обращений к модели: доля, посчитанная
      # от нуля, не значит ничего.
      - alert: ModelPromptCacheDegraded
        expr: >-
          sum by (environment) (rate(burcev_model_prompt_tokens_total{cached="yes"}[1h]))
          /
          clamp_min(sum by (environment) (rate(burcev_model_prompt_tokens_total[1h])), 0.001)
          < 0.5
          and
          sum by (environment) (rate(burcev_model_prompt_tokens_total[1h])) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: >-
            {{ $labels.environment }}: из кэша читается меньше половины
            отправляемых модели токенов — счёт растёт молча

      # Обращения к модели не проходят.
      #
      # Самый частый повод — кончились средства у провайдера. Снаружи этого не
      # видно: бот поддержки отвечает «передал ваш вопрос человеку» и
      # возвращает 200, то есть доля ошибок сервера не растёт. Признак
      # возможности в /ready тоже говорит «включено» — он проверяет наличие
      # ключа, а не способность им воспользоваться.
      #
      # Проверено на живом счёте: при нулевом остатке провайдер отвечает 402, и
      # обе возможности — бот и распознавание еды — перестают работать молча.
      - alert: ModelCallsFailing
        expr: increase(burcev_domain_events_total{event="model_call_failed"}[15m]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: >-
            {{ $labels.environment }}: обращения к модели не проходят —
            проверьте остаток средств у провайдера

      # Письма не уходят.
      #
      # Самый невидимый из отказов. Отправка сброса пароля отвечает «если
      # аккаунт существует, вы получите инструкции» независимо от исхода — так
      # и надо, иначе по ответу перебирают чужие адреса. Человек просто ждёт
      # письма, которого не будет, и пишет в поддержку про сломанный вход.
      #
      # Найдено ровно так: владелец не смог сбросить свой пароль. В журнале —
      # `535 Invalid user or password`, пароль приложения почты перестал
      # приниматься. При этом /ready показывал возможность включённой: признак
      # смотрит на наличие настроек, а не на их годность.
      - alert: EmailDeliveryFailing
        expr: increase(burcev_domain_events_total{event="email_failed"}[15m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: >-
            {{ $labels.environment }}: письма не уходят — проверьте пароль
            приложения у почтового провайдера

      # Возможность настроена и не работает.
      #
      # Признак в конфигурации отвечает только на вопрос «заданы ли настройки».
      # Дважды за один день это оказалось другим вопросом: у почты отозвали
      # пароль приложения, у провайдера модели кончились средства — и обе
      # возможности продолжали числиться доступными в /ready, пока люди не
      # упёрлись в них руками.
      #
      # Отсутствие метрики означает «не настроено» и тревогой не является:
      # выключенная возможность — это решение, а не поломка.
      - alert: CapabilityBroken
        expr: burcev_capability_healthy == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: >-
            {{ $labels.environment }}: возможность «{{ $labels.capability }}»
            настроена, но не отвечает
