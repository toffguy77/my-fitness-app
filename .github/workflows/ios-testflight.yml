name: iOS TestFlight

# Собирает подписанную сборку «Взвешено» и загружает её в TestFlight без
# отправки на ревью (lane beta). Номер сборки — число коммитов
# (apps/ios/scripts/build-number.sh), поэтому нужна полная история.
#
# Запуск — тегом `ios-v*` на любом коммите или вручную. Ручной запуск GitHub
# показывает, только когда файл уже есть в main; тег работает с любой ветки,
# потому что workflow берётся из самого коммита.
on:
  push:
    tags: ['ios-v*']
  workflow_dispatch:
    inputs:
      changelog:
        description: 'Что нового для тестировщиков'
        required: false
        default: 'Новая сборка'
      environment:
        description: 'Среда: prod (team.burcev.app) или dev (team.burcev.app.dev)'
        required: false
        default: 'prod'

permissions:
  contents: read

jobs:
  beta:
    name: TestFlight
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v5
        with:
          # Номер сборки — git rev-list --count HEAD.
          fetch-depth: 0

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Install fastlane and XcodeGen
        run: brew install fastlane xcodegen getsentry/tools/sentry-cli

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Decode App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          printf '%s' "$APP_STORE_CONNECT_API_KEY" | base64 --decode > fastlane/asc_key.p8
          echo "ASC_KEY_PATH=$PWD/fastlane/asc_key.p8" >> "$GITHUB_ENV"

      - name: Decode distribution certificate
        env:
          DISTRIBUTION_CERTIFICATE_P12: ${{ secrets.DISTRIBUTION_CERTIFICATE_P12 }}
        run: printf '%s' "$DISTRIBUTION_CERTIFICATE_P12" | base64 --decode > fastlane/certificate.p12

      - name: Build and upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          CHANGELOG: ${{ inputs.changelog || 'Новая сборка' }}
          APP_ENV: ${{ inputs.environment || 'prod' }}
        run: fastlane beta

      - name: Clean up secrets
        if: always()
        run: rm -f fastlane/asc_key.p8 fastlane/certificate.p12
