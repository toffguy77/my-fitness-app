name: CI Pipeline

on:
  push:
    branches: [main, develop, dev]
  pull_request:
    branches: [main, develop, dev]

permissions:
  contents: read
  statuses: write
  pull-requests: write

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '20'

jobs:
  # ---------------------------------------------------------------------------
  # Fast checks that need no services.
  # ---------------------------------------------------------------------------
  static-checks:
    name: Static Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      # Catches "frontend calls a route the backend never registered" — the
      # defect that shipped the password-change feature broken.
      - name: Check frontend/backend API contract
        run: node scripts/check-api-contract.mjs

      # Catches an internal href/router.push target the App Router has no
      # page.tsx for — check-api-contract.mjs only looks at /api/... calls,
      # so LeadList linking /curator/support/${id} (curator-lead-workspace
      # task 7) lived a whole review cycle before anyone clicked it.
      - name: Check internal links resolve to real pages
        run: node scripts/check-internal-links.mjs

      # Catches unused public env vars, secrets with a public prefix, duplicate
      # build configs and unimplemented handlers behind registered routes.
      - name: Check codebase integrity
        run: node scripts/check-codebase-integrity.mjs

      # Catches an E2E account the cleanup does not know about. The run on
      # the production server is only safe because every account it signs in
      # as gets deleted afterwards; an account added to the fixture and
      # forgotten in scripts/e2e-db-snapshot.sh survives the run, with
      # everything that references it, while the cleanup reports success.
      - name: Check E2E cleanup covers every test account
        run: node scripts/check-e2e-cleanup-covers-accounts.mjs

      # Same requirement from the other end: an address a spec types into a
      # form that matches none of the cleanup's guest patterns leaves its lead
      # — and the web conversation attached to it — on the server for good.
      # support-widget.spec.ts used widget-e2e@example.com, one hyphen away
      # from the pattern that would have covered it.
      - name: Check E2E guest emails are cleanable
        run: node scripts/check-e2e-guest-emails.mjs

      # Catches a setting in deploy/env/*.example that docker-compose.yml never
      # passes to any service: it can be set and does nothing, which is worse
      # than not existing. Twelve such settings were shipped, CORS_ORIGIN and a
      # secret-shaped NEXT_PUBLIC_* among them; none was read by any code.
      - name: Check deployment settings reach the code
        run: node scripts/check-deploy-env.mjs

      # Catches a button whose handler does nothing — a comment, or a
      # console.log, and no action. Two shipped: «Отправить недельный отчёт»
      # (pulsing, every Sunday) and the chevron on every task. Both were
      # visible, both stayed silent on click.
      - name: Check interface handlers do something
        run: node scripts/check-dead-handlers.mjs

      # Catches a Russian sentence written inline in a section that has been
      # translated, and a t() key the dictionary does not have.
      - name: Check translations
        run: node scripts/check-i18n.mjs

      # The guards above are code, and their own tests were written and then
      # never run by anything: only scripts/__tests__/dev-proxy.test.mjs was
      # wired in (in e2e.yml, where the proxy it tests is about to start).
      # A guard that silently stops matching passes every build it was meant
      # to fail, so the whole directory runs here.
      - name: Test the guards themselves
        run: node --test scripts/__tests__/

      - name: TypeScript
        run: npm run type-check

      - name: ESLint
        run: npm run lint:web

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      # The coverage floor lives in apps/web/jest.config.js and is enforced by
      # jest itself. There used to be an extra step here that only echoed
      # "coverage meets threshold" without measuring anything; it is gone.
      - name: Jest with coverage
        run: npm run test:coverage:ci --workspace=apps/web

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: apps/web/coverage/
          retention-days: 30

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/api/go.sum

      - working-directory: apps/api
        run: go mod download

      - name: gofmt
        working-directory: apps/api
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted. Run 'go fmt ./...'"
            gofmt -l .
            exit 1
          fi

      - name: go vet
        working-directory: apps/api
        run: go vet ./...

      # Тесты под тегами сборки обычный vet не видит, и они тихо гниют:
      # живой прогон бота перестал компилироваться на переезде с OpenRouter
      # на Yandex Foundation Models и молчал об этом, потому что собирать его
      # было некому. Здесь только сборка — запуск живых тестов стоит денег.
      - name: go vet (теги сборки)
        working-directory: apps/api
        run: |
          for tag in integration live; do
            echo "── $tag"
            go vet -tags="$tag" ./...
          done

      # -race is mandatory: the WebSocket hub is shared between goroutines and
      # curator analytics fan out through errgroup. Those races appear under
      # production load and not on a laptop.
      # Порог покрытия здесь больше не проверяется — он переехал в
      # «Integration Tests», где прогон видит и тесты против живой базы. Здесь
      # остаётся быстрая обратная связь: сборка, гонки, падения.
      - name: Tests with race detector
        working-directory: apps/api
        run: make test-coverage-ci

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/api/coverage.out
          retention-days: 30

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/api/go.sum

      # v8 of the action understands the v2 config schema in apps/api/.golangci.yml.
      # The version is pinned so a linter release cannot turn a green branch red.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: apps/api

  # ---------------------------------------------------------------------------
  # Everything below needs a real database. Unit tests run on sqlmock and never
  # execute SQL, which is how a migration once reached production unapplied.
  # ---------------------------------------------------------------------------
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # Та же мажорная версия, что в Yandex Cloud: на 16 проверки шли против
        # схемы, которой нигде нет. Разница уже вводила в заблуждение — PG17+
        # записывает NOT NULL отдельными ограничениями, и сравнение схем на
        # разных версиях показывало расхождения, которых не существует.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: burcev
          POSTGRES_PASSWORD: burcev
          POSTGRES_DB: burcev_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://burcev:burcev@localhost:5432/burcev_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/api/go.sum

      # Applies every migration forward against a clean database and rolls them
      # all back in reverse.
      - name: Migrations and integration tests
        working-directory: apps/api
        # No -run filter: the previous "-run Integration" matched no test name
        # and the job passed without executing anything — the same class of
        # empty check this pipeline exists to remove.
        #
        # Порог покрытия держится здесь, а не в «Backend Tests». Этот прогон
        # гоняет и обычные тесты, и те, что ходят в живую базу, — то есть видит
        # всё. Прогон без тега видел на четыре пункта меньше, и порог требовал
        # добирать число обычными тестами там, где код намеренно проверяется
        # против настоящей схемы, а не против подмен.
        run: make test-integration-ci

  build-images:
    name: Build Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Images are built once and shared. Previously three jobs each ran their
      # own docker build of both services.
      - name: Build web image
        run: docker build -t burcev-web:ci -f apps/web/Dockerfile .

      - name: Build API image
        run: docker build -t burcev-api:ci -f apps/api/Dockerfile apps/api

      - name: Export images
        run: docker save burcev-web:ci burcev-api:ci -o /tmp/images.tar

      - uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: /tmp/images.tar
          retention-days: 1

  container-security-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs: [build-images]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: /tmp

      - name: Load images
        run: docker load -i /tmp/images.tar

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Trivy scan web image
        run: trivy image --exit-code 1 --severity CRITICAL --ignorefile .trivyignore burcev-web:ci

      - name: Trivy scan API image
        run: trivy image --exit-code 1 --severity CRITICAL --ignorefile .trivyignore burcev-api:ci

      - name: Lint web Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: apps/web/Dockerfile
          failure-threshold: warning

      - name: Lint API Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: apps/api/Dockerfile
          failure-threshold: warning

  security-scan:
    # The name is what the repository ruleset requires on main. Renaming it
    # made the check unsatisfiable and blocked every merge to main, which is
    # the sort of thing a rename does when a rule elsewhere spells it out.
    name: Comprehensive Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      # These used to carry continue-on-error, which made them advisory. A
      # finding without an accepted exception now blocks the merge; record
      # accepted risk in .security-exceptions.yml.
      - name: npm audit
        run: npm audit --audit-level=high --omit=dev

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/api/go.sum

      - name: govulncheck
        working-directory: apps/api
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: detect-secrets
        run: |
          pip install detect-secrets
          detect-secrets scan --baseline .secrets.baseline

      # Security lint rules now run inside the main ESLint pass (Static Checks),
      # with a parser that can actually read TypeScript.

  performance-analysis:
    name: Performance Analysis
    runs-on: ubuntu-latest
    needs: [build-images]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Build frontend
        run: npm run build:web
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: /tmp

      - name: Report sizes
        run: |
          docker load -i /tmp/images.tar
          {
            echo "## Artifact sizes"
            echo '```'
            du -sh apps/web/.next/ apps/web/.next/static/
            docker images burcev-web:ci --format "Web image:  {{.Size}}"
            docker images burcev-api:ci --format "API image:  {{.Size}}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Single required status for branch protection.
  # ---------------------------------------------------------------------------
  ci-pipeline:
    name: CI Pipeline
    runs-on: ubuntu-latest
    if: always()
    needs:
      - static-checks
      - frontend-tests
      - backend-tests
      - backend-lint
      - integration-tests
      - build-images
      - container-security-scan
      - security-scan
    steps:
      - name: Verify every required check passed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "Results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "A required check did not pass."
              exit 1
            fi
          done
          echo "All required checks passed."
