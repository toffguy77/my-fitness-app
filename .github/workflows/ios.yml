name: iOS

# Сборка, линтер и тесты приложения «Взвешено» на симуляторе (ios-ci).
# Подпись не нужна — она только при выкладке (ios-testflight.yml). Своего Mac
# у разработки нет: этот прогон — единственное место, где Swift собирается
# для iOS. Ядро модулей VzveshenoKit проверяется и на Linux (apps/ios/README.md).
#
# Отдельный файл, а не задача в ci.yml: имена обязательных проверок там —
# договор (CLAUDE.md), а эта проверка в обязательные не входит, пока
# приложение не в App Store.
on:
  push:
    branches: [dev, main, 'feat/ios-**']
    paths: ['apps/ios/**', 'packages/design-tokens/**', '.github/workflows/ios.yml']
  pull_request:
    branches: [dev, main]
    paths: ['apps/ios/**', 'packages/design-tokens/**', '.github/workflows/ios.yml']
  # Ручной запуск. Без входов — полный прогон, как на push. С `only_testing` —
  # только названные тесты, `iterations` раз подряд до первого провала: так
  # один прогон доказывает, что нестабильный тест больше не падает
  # (apps/ios/README.md, «Прогон отдельных тестов»).
  workflow_dispatch:
    inputs:
      only_testing:
        description: 'Тесты для -only-testing через пробел или запятую (VzveshenoUITests/AccessibilityAuditUITests/testChat); пусто — весь набор'
        type: string
        required: false
        default: ''
      iterations:
        description: 'Сколько раз подряд прогнать выбранные тесты (только вместе с only_testing)'
        type: number
        required: false
        default: 1

permissions:
  contents: read

# Выборка — в имени группы: два ручных запуска с разными тестами на одной
# ветке идут оба, а не отменяют друг друга. У push и PR выборки нет.
concurrency:
  group: ios-${{ github.ref }}-${{ inputs.only_testing }}
  cancel-in-progress: true

jobs:
  ios:
    name: ios
    runs-on: macos-15
    # Прогон на dev — около 37 минут, а аудит доступности на каждом экране
    # клиента и куратора добавляет ещё несколько; с повтором упавших тестов
    # 45 минут обрывали прогон до итога.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/ios
    env:
      # Снапшоты сняты на этом симуляторе; на другой версии iOS они разойдутся.
      DESTINATION: platform=iOS Simulator,name=iPhone 16 Pro,OS=18.5
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Install XcodeGen and SwiftLint
        run: brew install xcodegen swiftlint

      - name: Cache SwiftPM and DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            apps/ios/build/DerivedData
          key: ios-dd-${{ hashFiles('apps/ios/project.yml', 'apps/ios/VzveshenoKit/Package.swift') }}-${{ github.sha }}
          restore-keys: |
            ios-dd-${{ hashFiles('apps/ios/project.yml', 'apps/ios/VzveshenoKit/Package.swift') }}-

      - name: Generate Xcode project
        run: xcodegen generate

      # Сгенерированные Info.plist и entitlements — валидные списки свойств.
      - name: Lint generated plists
        run: plutil -lint Vzvesheno/Info.plist VzveshenoWidgets/Info.plist Vzvesheno/Vzvesheno.entitlements VzveshenoWidgets/VzveshenoWidgets.entitlements

      - name: SwiftLint
        run: swiftlint lint --strict

      - name: SwiftLint colour rule still fires
        run: scripts/check-color-rule.sh

      - name: Check the simulator
        run: |
          # Снапшоты привязаны к iPhone 16 Pro на iOS 18.5. Если образ раннера
          # его больше не содержит — громко, а не молча на другом симуляторе.
          xcrun simctl list runtimes | grep -q "iOS 18.5" || {
            echo "::error::нет iOS 18.5; доступны:"; xcrun simctl list runtimes; exit 1; }

      # Повтор упавшего теста до трёх раз: UI-тесты на раннере падают и без
      # дефекта — не инициализируется раннер UI-тестов (AXDisableAccessibility…),
      # аудит доступности не укладывается во время. Дефект в коде падает все
      # три раза; повтор, прошедший со второй попытки, виден в xcresult.
      # TEST_RUNNER_CI доходит до тестов как CI: снапшот без эталона в CI
      # падает при каждом повторе (`.new.png` в артефакте), а не записывает
      # эталон, который повтор нашёл бы и прошёл.
      # Ручной запуск с only_testing — без повторов: выбранные тесты идут
      # `iterations` раз подряд и останавливаются на первом провале.
      - name: Build and test
        id: test
        env:
          TEST_RUNNER_CI: "true"
          ONLY_TESTING: ${{ inputs.only_testing }}
          ITERATIONS: ${{ inputs.iterations }}
        run: |
          set -o pipefail
          mkdir -p build
          rm -rf build/Vzvesheno.xcresult
          selection=()
          ui_only=false
          if [ -n "${ONLY_TESTING//[ ,]/}" ]; then
            ui_only=true
            read -ra ids <<< "${ONLY_TESTING//,/ }"
            for id in "${ids[@]}"; do
              [[ "$id" =~ ^[A-Za-z0-9_/]+$ ]] || { echo "::error::не идентификатор теста: $id"; exit 1; }
              [[ "$id" == VzveshenoUITests* ]] || ui_only=false
              selection+=("-only-testing:$id")
            done
            iterations="${ITERATIONS:-1}"
            [[ "$iterations" =~ ^[1-9][0-9]*$ ]] || { echo "::error::iterations — целое от 1: $iterations"; exit 1; }
            if [ "$iterations" -gt 1 ]; then
              selection+=(-test-iterations "$iterations" -run-tests-until-failure)
            fi
            echo "Выборка: ${selection[*]}"
          else
            selection=(-retry-tests-on-failure -test-iterations 3)
          fi
          echo "ui_only=$ui_only" >> "$GITHUB_OUTPUT"
          xcodebuild test \
            -project Vzvesheno.xcodeproj \
            -scheme Vzvesheno-Dev \
            -destination "$DESTINATION" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/Vzvesheno.xcresult \
            "${selection[@]}" \
            | tee build/xcodebuild.log \
            | grep -E "error:|warning: .*/apps/ios/V|Test Case .* failed|with [0-9]+ failures|\*\* (BUILD|TEST) " || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build/xcodebuild.log

      # Проверки состава сборки и снапшотов — дело полного прогона; при
      # выборке одних UI-тестов снапшоты не снимаются.
      - name: Check the built bundle
        if: inputs.only_testing == ''
        run: scripts/check-bundle.sh build/DerivedData/Build/Products/Dev-Debug-iphonesimulator/Vzvesheno.app

      - name: Upload snapshots
        if: always() && steps.test.outputs.ui_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-snapshots
          path: apps/ios/**/__Snapshots__/**
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcresult
          path: |
            apps/ios/build/Vzvesheno.xcresult
            apps/ios/build/xcodebuild.log
          if-no-files-found: ignore
