services:
  # Frontend - Next.js (production)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        - NEXT_PUBLIC_YANDEX_METRIKA_ID=${NEXT_PUBLIC_YANDEX_METRIKA_ID}
        # Inlined at build time: empty means the "ask in Telegram" link is not
        # shown at all, which is better than a link to a bot nobody runs.
        - NEXT_PUBLIC_TELEGRAM_BOT=${NEXT_PUBLIC_TELEGRAM_BOT}
        - NEXT_PUBLIC_APP_VERSION=${APP_VERSION:-dev}
        - CACHE_BUST=${CACHE_BUST:-1}
    expose:
      - "3069"
    environment:
      - NODE_ENV=production
    depends_on:
      - api
    networks:
      - dokploy-network
      - burcev-network
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m

  # Backend API - Go (production)
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: production
    expose:
      - "4000"
    labels:
      - "traefik.enable=true"
      # WebSocket: /ws -> API (Traefik handles upgrade natively)
      - "traefik.http.routers.burcev-${APP_ENV:-dev}-api-ws.rule=Host(`${APP_DOMAIN:-new.burcev.team}`) && Path(`/ws`)"
      - "traefik.http.routers.burcev-${APP_ENV:-dev}-api-ws.entrypoints=websecure"
      - "traefik.http.routers.burcev-${APP_ENV:-dev}-api-ws.tls.certresolver=letsencrypt"
      - "traefik.http.routers.burcev-${APP_ENV:-dev}-api-ws.service=burcev-${APP_ENV:-dev}-api"
      # REST API: /api/v1/* -> API (direct, bypasses Next.js rewrite)
      - "traefik.http.routers.burcev-${APP_ENV:-dev}-api-rest.rule=Host(`${APP_DOMAIN:-new.burcev.team}`) && PathPrefix(`/api/v1`)"
      - "traefik.http.routers.burcev-${APP_ENV:-dev}-api-rest.entrypoints=websecure"
      - "traefik.http.routers.burcev-${APP_ENV:-dev}-api-rest.tls.certresolver=letsencrypt"
      - "traefik.http.routers.burcev-${APP_ENV:-dev}-api-rest.service=burcev-${APP_ENV:-dev}-api"
      # Liveness: /health -> API. Answers while the process is alive, without
      # touching the database.
      - "traefik.http.routers.burcev-${APP_ENV:-dev}-api-health.rule=Host(`${APP_DOMAIN:-new.burcev.team}`) && Path(`/health`)"
      - "traefik.http.routers.burcev-${APP_ENV:-dev}-api-health.entrypoints=websecure"
      - "traefik.http.routers.burcev-${APP_ENV:-dev}-api-health.tls.certresolver=letsencrypt"
      - "traefik.http.routers.burcev-${APP_ENV:-dev}-api-health.service=burcev-${APP_ENV:-dev}-api"
      # Readiness: /ready -> API. Checks the database and answers 503 when it is
      # unreachable, which is what a deployment should wait for — without this
      # route it reached Next.js and returned 404 for every probe.
      - "traefik.http.routers.burcev-${APP_ENV:-dev}-api-ready.rule=Host(`${APP_DOMAIN:-new.burcev.team}`) && Path(`/ready`)"
      - "traefik.http.routers.burcev-${APP_ENV:-dev}-api-ready.entrypoints=websecure"
      - "traefik.http.routers.burcev-${APP_ENV:-dev}-api-ready.tls.certresolver=letsencrypt"
      - "traefik.http.routers.burcev-${APP_ENV:-dev}-api-ready.service=burcev-${APP_ENV:-dev}-api"
      # Service definition
      - "traefik.http.services.burcev-${APP_ENV:-dev}-api.loadbalancer.server.port=4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_SSL_MODE=${DB_SSL_MODE}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME}
      - APP_DOMAIN=${APP_DOMAIN:-new.burcev.team}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - S3_REGION=${S3_REGION}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - WEEKLY_PHOTOS_S3_ACCESS_KEY_ID=${WEEKLY_PHOTOS_S3_ACCESS_KEY_ID}
      - WEEKLY_PHOTOS_S3_SECRET_ACCESS_KEY=${WEEKLY_PHOTOS_S3_SECRET_ACCESS_KEY}
      - WEEKLY_PHOTOS_S3_BUCKET=${WEEKLY_PHOTOS_S3_BUCKET}
      - WEEKLY_PHOTOS_S3_REGION=${WEEKLY_PHOTOS_S3_REGION}
      - WEEKLY_PHOTOS_S3_ENDPOINT=${WEEKLY_PHOTOS_S3_ENDPOINT}
      - PROFILE_PHOTOS_S3_ACCESS_KEY_ID=${PROFILE_PHOTOS_S3_ACCESS_KEY_ID}
      - PROFILE_PHOTOS_S3_SECRET_ACCESS_KEY=${PROFILE_PHOTOS_S3_SECRET_ACCESS_KEY}
      - PROFILE_PHOTOS_S3_BUCKET=${PROFILE_PHOTOS_S3_BUCKET}
      - PROFILE_PHOTOS_S3_REGION=${PROFILE_PHOTOS_S3_REGION}
      - PROFILE_PHOTOS_S3_ENDPOINT=${PROFILE_PHOTOS_S3_ENDPOINT}
      - CHAT_S3_ACCESS_KEY_ID=${CHAT_S3_ACCESS_KEY_ID}
      - CHAT_S3_SECRET_ACCESS_KEY=${CHAT_S3_SECRET_ACCESS_KEY}
      - CHAT_S3_BUCKET=${CHAT_S3_BUCKET}
      - CHAT_S3_REGION=${CHAT_S3_REGION}
      - CHAT_S3_ENDPOINT=${CHAT_S3_ENDPOINT}
      - CONTENT_S3_ACCESS_KEY_ID=${CONTENT_S3_ACCESS_KEY_ID}
      - CONTENT_S3_SECRET_ACCESS_KEY=${CONTENT_S3_SECRET_ACCESS_KEY}
      - CONTENT_S3_BUCKET=${CONTENT_S3_BUCKET}
      - CONTENT_S3_REGION=${CONTENT_S3_REGION}
      - CONTENT_S3_ENDPOINT=${CONTENT_S3_ENDPOINT}
      - FOOD_PHOTOS_S3_ACCESS_KEY_ID=${FOOD_PHOTOS_S3_ACCESS_KEY_ID}
      - FOOD_PHOTOS_S3_SECRET_ACCESS_KEY=${FOOD_PHOTOS_S3_SECRET_ACCESS_KEY}
      - FOOD_PHOTOS_S3_BUCKET=${FOOD_PHOTOS_S3_BUCKET}
      - FOOD_PHOTOS_S3_REGION=${FOOD_PHOTOS_S3_REGION}
      - FOOD_PHOTOS_S3_ENDPOINT=${FOOD_PHOTOS_S3_ENDPOINT}
      - S3_PATH_PREFIX=${S3_PATH_PREFIX}
      - CONTENT_S3_PATH_PREFIX=${CONTENT_S3_PATH_PREFIX}
      # Pool and migration knobs. They have working defaults; being able to
      # change them without a code change is the point — the connection limit
      # is what a slow night looks like from the outside.
      - DB_MAX_OPEN_CONNS=${DB_MAX_OPEN_CONNS:-10}
      - DB_MAX_IDLE_CONNS=${DB_MAX_IDLE_CONNS:-5}
      - DB_MIGRATION_BASELINE=${DB_MIGRATION_BASELINE:-0}
      - APP_ENV=${APP_ENV}
      - LOG_LEVEL=${LOG_LEVEL}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL}
      - FOOD_RECOGNITION_DAILY_LIMIT=${FOOD_RECOGNITION_DAILY_LIMIT}
      # Optional capabilities: absent values switch the feature off and are
      # reported at startup and in /health, rather than failing the boot.
      - YANDEX_OAUTH_CLIENT_ID=${YANDEX_OAUTH_CLIENT_ID}
      - YANDEX_OAUTH_CLIENT_SECRET=${YANDEX_OAUTH_CLIENT_SECRET}
      - VK_OAUTH_CLIENT_ID=${VK_OAUTH_CLIENT_ID}
      - VK_OAUTH_CLIENT_SECRET=${VK_OAUTH_CLIENT_SECRET}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}
      - SUPPORT_MODEL=${SUPPORT_MODEL}
      - SUPPORT_DAILY_LIMIT=${SUPPORT_DAILY_LIMIT}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - APP_VERSION=${APP_VERSION:-dev}
    networks:
      - dokploy-network
      - burcev-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:4000/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    mem_limit: 256m
    memswap_limit: 256m

networks:
  dokploy-network:
    external: true
  burcev-network:
    driver: bridge
