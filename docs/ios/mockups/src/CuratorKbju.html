<style>
body{margin:0}
.ph{--canvas:#F6F1E8;--surface:#FFFCF6;--subtle:#EFE7DA;--fg:#2A2118;--muted:#5E5245;--sub:#76695A;--line:#E3D8C6;--primary:#B8492F;--pfg:#FFFFFF;--psoft:#B8492F1A;
width:390px;height:844px;position:relative;overflow:hidden;background:#3B342C;color:var(--fg);font-family:'Golos Text',system-ui,sans-serif;font-size:16px;line-height:24px}
.serif{font-family:'Literata',Georgia,serif;font-weight:500}
.cap{font-size:13px;line-height:18px;color:var(--muted)}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.f{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 14px;height:48px;border-top:1px solid var(--line);font-size:15px}
.f:first-child{border-top:none}
.f input{border:none;background:transparent;text-align:right;font:500 16px 'Golos Text',sans-serif;color:var(--fg);width:120px;outline:none}
.seg{display:flex;background:var(--subtle);border-radius:12px;padding:3px}
.seg span{flex:1;text-align:center;font-size:13px;line-height:18px;padding:7px 0;border-radius:9px;font-weight:500;color:var(--muted)}
.seg .on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
</style>

<div class="ph">
<div style="position:absolute;left:10px;right:10px;top:52px;height:60px;border-radius:14px 14px 0 0;background:#8F8476;opacity:.5"></div>
<div style="position:absolute;left:0;right:0;top:64px;bottom:0;background:var(--canvas);border-radius:28px 28px 0 0;padding:8px 20px 0;box-sizing:border-box;display:flex;flex-direction:column;gap:14px">
<div style="width:36px;height:5px;border-radius:3px;background:var(--line);align-self:center"></div>
<div style="display:flex;align-items:center;justify-content:space-between">
<a href="CuratorChat.dc.html" style="color:var(--primary);font-weight:500;text-decoration:none">Отмена</a>
<span class="serif" style="font-size:18px">Запись для Марии</span>
<span style="color:var(--sub);font-weight:600">Готово</span>
</div>
<div style="display:flex;gap:12px;align-items:center">
<span role="img" aria-label="Фото клиента" style="width:64px;height:64px;border-radius:12px;background:radial-gradient(60% 70% at 50% 50%,#E9D7BC 0%,#C9A57E 55%,#7A5A3E 100%);flex-shrink:0"></span>
<span class="cap">Запись попадёт в дневник клиента с пометкой «Добавлено куратором», в чате появится карточка.</span>
</div>
<div class="seg" role="radiogroup" aria-label="Приём пищи"><span role="radio" aria-checked="false">Завтрак</span><span role="radio" aria-checked="false">Обед</span><span class="on" role="radio" aria-checked="true">Ужин</span><span role="radio" aria-checked="false">Перекус</span></div>
<div class="grp">
<label class="f">Блюдо<input value="Торт «Наполеон»" style="width:200px"></label>
<label class="f">Вес, г<input value="180" inputmode="decimal"></label>
</div>
<div class="grp">
<label class="f">Калории<input value="684" inputmode="decimal"></label>
<label class="f"><span style="color:#4666B0">Белки, г</span><input value="9"></label>
<label class="f"><span style="color:#9A650C">Жиры, г</span><input value="45"></label>
<label class="f"><span style="color:#4E7A3D">Углеводы, г</span><input value="61"></label>
</div>
<button style="height:52px;border:none;border-radius:14px;background:var(--primary);color:var(--pfg);font:600 16px 'Golos Text',sans-serif;margin-top:4px">Записать в дневник</button>
</div>
</div>
