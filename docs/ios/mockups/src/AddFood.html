<style>
body{margin:0}
.ph{--canvas:#F6F1E8;--surface:#FFFCF6;--subtle:#EFE7DA;--fg:#2A2118;--muted:#5E5245;--sub:#76695A;--line:#E3D8C6;--primary:#B8492F;--pfg:#FFFFFF;--psoft:#B8492F1A;--protein:#4666B0;--fatfg:#9A650C;--carbsfg:#4E7A3D;
width:390px;height:844px;position:relative;overflow:hidden;background:#3B342C;color:var(--fg);font-family:'Golos Text',system-ui,sans-serif;font-size:16px;line-height:24px}

</label>

</div>
<div style="background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px">
