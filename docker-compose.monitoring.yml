# Сбор метрик и дашборд, рядом с приложением на том же сервере.
#
# Файл лежит в корне, а не в monitoring/, намеренно: compose ищет .env рядом с
# самим файлом, а Dokploy кладёт переменные проекта в корень репозитория. Из
# каталога monitoring/ переменные не подхватывались, и сборка падала на разборе
# файла, ещё до запуска контейнеров.
#
# Отдельный проект Dokploy: у наблюдения свой жизненный цикл, и оно не должно
# перезапускаться вместе с приложением — особенно тогда, когда приложению плохо
# и смотреть надо именно на него.
#
# Обе службы висят в dokploy-network, чтобы дотянуться до API по сетевому
# псевдониму (burcev-dev-api, burcev-prod-api), и наружу отдаются только через
# Traefik по своему домену, с собственным входом в Grafana.

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Пятнадцать дней: этого хватает, чтобы посмотреть «а как было до», и
      # диск не растёт бесконечно на сервере, где живёт и само приложение.
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      - dokploy-network
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # Alertmanager разворачивает сработавшее правило в сообщение и решает, когда
  # его повторить. Отдельно от Prometheus, потому что это его работа: Prometheus
  # умеет заметить, но не умеет замолчать на время починки.
  alertmanager:
    image: prom/alertmanager:v0.28.0
    # Значения подставляются в копию конфига перед запуском: сам Alertmanager
    # переменные окружения в конфиге не раскрывает.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        sed -e "s|__BOT_TOKEN__|$$TELEGRAM_ALERT_BOT_TOKEN|"
        -e "s|__CHAT_ID__|$$TELEGRAM_ALERT_CHAT_ID|"
        /etc/alertmanager/alertmanager.yml > /tmp/alertmanager.yml
        && exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    environment:
      # Без токена контейнер не поднимется. Это честнее, чем работать и молча
      # копить оповещения, которым некуда идти.
      - TELEGRAM_ALERT_BOT_TOKEN=${TELEGRAM_ALERT_BOT_TOKEN:?нужен TELEGRAM_ALERT_BOT_TOKEN}
      - TELEGRAM_ALERT_CHAT_ID=${TELEGRAM_ALERT_CHAT_ID:?нужен TELEGRAM_ALERT_CHAT_ID}
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - dokploy-network
    restart: unless-stopped
    mem_limit: 192m
    memswap_limit: 192m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  grafana:
    image: grafana/grafana:11.5.1
    environment:
      # Пароль задаётся переменной окружения проекта в Dokploy; без него
      # Grafana поднимется с admin/admin, а она смотрит наружу.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?нужен GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://${GRAFANA_DOMAIN:-metrics.burcev.team}
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
    networks:
      - dokploy-network
    depends_on:
      - prometheus
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 384m
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.burcev-grafana.rule=Host(`${GRAFANA_DOMAIN:-metrics.burcev.team}`)"
      - "traefik.http.routers.burcev-grafana.entrypoints=websecure"
      - "traefik.http.routers.burcev-grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.burcev-grafana.loadbalancer.server.port=3000"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:

networks:
  dokploy-network:
    external: true
