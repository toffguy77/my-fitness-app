# Accepted security findings.
#
# npm audit, govulncheck, Trivy and the ESLint security rules block a merge.
# When a finding cannot be fixed right now, record it here with a reason and a
# review date, rather than switching the check back to advisory — an advisory
# check is one nobody reads.
#
# Format:
#   - id: <advisory or rule id>
#     tool: npm-audit | govulncheck | trivy | eslint-security
#     reason: why it is accepted
#     review_by: YYYY-MM-DD
#     owner: who re-evaluates it
#
# Trivy findings additionally need an entry in .trivyignore, which is the file
# that tool reads. This file is the record of *why*.

exceptions:
  - id: DL3018
    tool: hadolint
    reason: >-
      Alpine package versions are deliberately unpinned. The base image tag
      already fixes the Alpine release, and `apk upgrade` exists to pull
      security patches — pinning would defeat it and break the build whenever
      Alpine rotates a version out of the repository.
    review_by: 2027-03-01
    owner: platform
