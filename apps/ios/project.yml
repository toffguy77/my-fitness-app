# Проект «Взвешено» для XcodeGen: `xcodegen generate` → Vzvesheno.xcodeproj.
# Сам .xcodeproj, Info.plist и .entitlements генерируются и в git не хранятся
# (design.md ios-app-foundation).
#
# Две среды, у каждой отладочная и выпускная конфигурация:
#   Dev  → https://new.burcev.team, team.burcev.app.dev, push development;
#   Prod → https://burcev.team,     team.burcev.app,     push production.
# Схемы: Vzvesheno-Dev и Vzvesheno-Prod.
name: Vzvesheno
options:
  bundleIdPrefix: team.burcev
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: ru
  # Номер сборки — число коммитов, при каждой генерации проекта; руками не
  # правится. Один файл на все цели: у приложения и расширения он обязан
  # совпадать, иначе App Store отвергнет архив.
  preGenCommand: scripts/build-number.sh

configs:
  Dev-Debug: debug
  Dev-Release: release
  Prod-Debug: debug
  Prod-Release: release

configFiles:
  Dev-Debug: BuildNumber.xcconfig
  Dev-Release: BuildNumber.xcconfig
  Prod-Debug: BuildNumber.xcconfig
  Prod-Release: BuildNumber.xcconfig

packages:
  VzveshenoKit:
    path: VzveshenoKit
  # Единственный сторонний пакет приложения — отчёты о сбоях. Никакой
  # аналитики, рекламы и атрибуции (ios-platform-compliance); список
  # сверяет VzveshenoTests/ComplianceTests.
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "8.40.0"

settings:
  base:
    DEVELOPMENT_TEAM: "3GWRDGA8B7"
    MARKETING_VERSION: "1.0.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    # Ключ клиента Sentry — не секрет: он и так внутри каждой сборки.
    SENTRY_DSN: "https://d56ff91d01b9f3dc3471a82ce8c2fa98@o4512056899862528.ingest.de.sentry.io/4512238496186448"
  configs:
    Dev-Debug:
      APP_ENV: dev
      API_BASE_URL: "https://new.burcev.team"
      APP_DOMAIN: new.burcev.team
      APP_BUNDLE_ID: team.burcev.app.dev
      APP_GROUP_ID: group.team.burcev.app.dev
      KEYCHAIN_GROUP: team.burcev.app.dev.shared
      APS_ENVIRONMENT: development
      SENTRY_ENVIRONMENT: development
      # Справочник компонентов и заглушки для UI-тестов — только в Dev.
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG DEV_BUILD"
    Dev-Release:
      APP_ENV: dev
      API_BASE_URL: "https://new.burcev.team"
      APP_DOMAIN: new.burcev.team
      APP_BUNDLE_ID: team.burcev.app.dev
      APP_GROUP_ID: group.team.burcev.app.dev
      KEYCHAIN_GROUP: team.burcev.app.dev.shared
      APS_ENVIRONMENT: development
      SENTRY_ENVIRONMENT: development
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEV_BUILD"
    Prod-Debug:
      APP_ENV: prod
      API_BASE_URL: "https://burcev.team"
      APP_DOMAIN: burcev.team
      APP_BUNDLE_ID: team.burcev.app
      APP_GROUP_ID: group.team.burcev.app
      KEYCHAIN_GROUP: team.burcev.app.shared
      APS_ENVIRONMENT: production
      SENTRY_ENVIRONMENT: production
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
    Prod-Release:
      APP_ENV: prod
      API_BASE_URL: "https://burcev.team"
      APP_DOMAIN: burcev.team
      APP_BUNDLE_ID: team.burcev.app
      APP_GROUP_ID: group.team.burcev.app
      KEYCHAIN_GROUP: team.burcev.app.shared
      APS_ENVIRONMENT: production
      SENTRY_ENVIRONMENT: production
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""

targets:
  Vzvesheno:
    type: application
    platform: iOS
    sources:
      - path: Vzvesheno
        excludes:
          - "**/*.entitlements"
          - "Info.plist"
          - "Resources/PrivacyInfo.xcprivacy"
      # Манифест приватности: без него Apple отвергает загрузку (ITMS-91053).
      - path: Vzvesheno/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: VzveshenoWidgets
        embed: true
      - package: VzveshenoKit
        product: DesignSystem
      - package: VzveshenoKit
        product: API
      - package: VzveshenoKit
        product: Session
      - package: VzveshenoKit
        product: Outbox
      - package: VzveshenoKit
        product: Navigation
      - package: VzveshenoKit
        product: Health
      - package: VzveshenoKit
        product: Client
      - package: VzveshenoKit
        product: Curator
      - package: Sentry
        product: Sentry
    info:
      path: Vzvesheno/Info.plist
      properties:
        CFBundleDisplayName: Взвешено
        CFBundleName: Взвешено
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru]
        ITSAppUsesNonExemptEncryption: false
        APIBaseURL: "$(API_BASE_URL)"
        AppEnvironment: "$(APP_ENV)"
        AppGroupID: "$(APP_GROUP_ID)"
        KeychainAccessGroup: "$(AppIdentifierPrefix)$(KEYCHAIN_GROUP)"
        SentryDSN: "$(SENTRY_DSN)"
        SentryEnvironment: "$(SENTRY_ENVIRONMENT)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Досылка очереди: пуш с content-available, фоновое обновление и
        # BGAppRefreshTask (ios-platform-compliance).
        UIBackgroundModes: [remote-notification, fetch]
        BGTaskSchedulerPermittedIdentifiers: ["$(PRODUCT_BUNDLE_IDENTIFIER).outbox"]
        NSHealthShareUsageDescription: "Взвешено читает шаги, вес и тренировки, чтобы вам не вводить их вручную, а куратор видел активность."
        NSHealthUpdateUsageDescription: "Взвешено записывает в Здоровье съеденные калории, белки, жиры, углеводы и выпитую воду."
        NSCameraUsageDescription: "Камера нужна, чтобы сканировать штрихкод продукта и фотографировать блюдо для распознавания."
        NSPhotoLibraryUsageDescription: "Доступ к фото нужен, чтобы выбрать снимок блюда или фотографию прогресса."
        # «Сохранить изображение» из share sheet вложения в переписке.
        NSPhotoLibraryAddUsageDescription: "Разрешите сохранять в Фото снимки из переписки с куратором."
    entitlements:
      path: Vzvesheno/Vzvesheno.entitlements
      properties:
        aps-environment: "$(APS_ENVIRONMENT)"
        com.apple.developer.associated-domains:
          - "applinks:$(APP_DOMAIN)"
          - "webcredentials:$(APP_DOMAIN)"
        com.apple.developer.applesignin: [Default]
        com.apple.security.application-groups: ["$(APP_GROUP_ID)"]
        keychain-access-groups: ["$(AppIdentifierPrefix)$(KEYCHAIN_GROUP)"]
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_ID)"
        PRODUCT_NAME: Vzvesheno
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # Симулятор подписывается локально, без профиля и сертификата.
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"

  VzveshenoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: VzveshenoWidgets
        excludes:
          - "**/*.entitlements"
          - "Info.plist"
          - "PrivacyInfo.xcprivacy"
      - path: VzveshenoWidgets/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: VzveshenoKit
        product: DesignSystem
      - package: VzveshenoKit
        product: Session
      - package: VzveshenoKit
        product: Outbox
    info:
      path: VzveshenoWidgets/Info.plist
      properties:
        CFBundleDisplayName: Взвешено
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: ru
        AppGroupID: "$(APP_GROUP_ID)"
        KeychainAccessGroup: "$(AppIdentifierPrefix)$(KEYCHAIN_GROUP)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: VzveshenoWidgets/VzveshenoWidgets.entitlements
      properties:
        com.apple.security.application-groups: ["$(APP_GROUP_ID)"]
        keychain-access-groups: ["$(AppIdentifierPrefix)$(KEYCHAIN_GROUP)"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_ID).widget"
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"

  VzveshenoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VzveshenoTests
    dependencies:
      - target: Vzvesheno
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_ID).tests"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"

  VzveshenoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VzveshenoUITests
    dependencies:
      - target: Vzvesheno
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_ID).uitests"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"

schemes:
  Vzvesheno-Dev:
    build:
      targets:
        Vzvesheno: all
        VzveshenoTests: [test]
        VzveshenoUITests: [test]
    run:
      config: Dev-Debug
    test:
      config: Dev-Debug
      language: ru
      region: RU
      targets:
        - VzveshenoTests
        - VzveshenoUITests
        - package: VzveshenoKit/DesignSystemTests
        - package: VzveshenoKit/APITests
        - package: VzveshenoKit/SessionTests
        - package: VzveshenoKit/OutboxTests
        - package: VzveshenoKit/NavigationTests
        - package: VzveshenoKit/HealthTests
        - package: VzveshenoKit/ClientTests
        - package: VzveshenoKit/CuratorTests
    profile:
      config: Dev-Release
    analyze:
      config: Dev-Debug
    archive:
      config: Dev-Release
  Vzvesheno-Prod:
    build:
      targets:
        Vzvesheno: all
        VzveshenoTests: [test]
    run:
      config: Prod-Debug
    test:
      config: Prod-Debug
      language: ru
      region: RU
      targets:
        - VzveshenoTests
    profile:
      config: Prod-Release
    analyze:
      config: Prod-Debug
    archive:
      config: Prod-Release
