name: Burcev
options:
  bundleIdPrefix: team.burcev
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: "3GWRDGA8B7"
    SWIFT_VERSION: "6.0"
  configs:
    # Отладочная сборка ходит в dev-стенд, сборка для TestFlight — в прод.
    Debug:
      API_BASE_URL: "https://new.burcev.team"
    Release:
      API_BASE_URL: "https://burcev.team"

targets:
  Burcev:
    type: application
    platform: iOS
    sources:
      - path: Burcev/Sources
      - path: Burcev/Assets.xcassets
      # Манифест конфиденциальности: без объявления UserDefaults Apple
      # отвергает загрузку (ITMS-91053) письмом, а сборка не появляется.
      - path: Burcev/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Burcev/Info.plist
      properties:
        CFBundleDisplayName: BURCEV
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        APIBaseURL: "$(API_BASE_URL)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleDevelopmentRegion: ru
        NSHealthShareUsageDescription: "BURCEV читает шаги, вес и тренировки, чтобы вам не вводить их вручную, а куратор видел активность."
        NSHealthUpdateUsageDescription: "BURCEV записывает в Здоровье съеденные калории, белки, жиры, углеводы и выпитую воду."
        NSCameraUsageDescription: "Камера нужна, чтобы сканировать штрихкод продукта и фотографировать блюдо для распознавания."
        NSPhotoLibraryUsageDescription: "Доступ к фото нужен, чтобы выбрать снимок блюда или фотографию прогресса."
        CFBundleLocalizations:
          - ru
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: team.burcev.app
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Burcev/Burcev.entitlements
        SWIFT_STRICT_CONCURRENCY: complete

  BurcevTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BurcevTests
    dependencies:
      - target: Burcev
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: team.burcev.app.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

schemes:
  Burcev:
    build:
      targets:
        Burcev: all
        BurcevTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BurcevTests
    archive:
      config: Release
